# Render Cron Job設定
# 毎朝7時（日本時間）にSlack通知を送信

services: []

cron:
  # 今日のゴミ通知（毎朝7時 JST = 22時 UTC前日）
  - name: garbage-notify-morning
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js --slack-today
    schedule: "0 22 * * *"  # UTC 22:00 = JST 07:00
    envVars:
      - key: SLACK_WEBHOOK_URL
        sync: false  # Renderダッシュボードで設定
      - key: GARBAGE_CSV_PATH
        sync: false  # オプション: CSVを使う場合
      - key: TZ
        value: Asia/Tokyo
